<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - New Aryan Golden Jewelers</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Mukta:wght@400;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="admin-container">
        <!-- Header -->
        <header class="admin-header">
            <h1>New Aryan Golden Jewelers</h1>
            <p>Admin Dashboard & Inventory Control</p>
            <a href="index.html" target="_blank" class="link-btn">Go to Customer Page ➔</a>
        </header>

        <!-- 1. Shop Open / Close Switch -->
        <section class="admin-section">
            <h2>Shop Status Switch</h2>
            <div id="statusDisplay" class="status-box open">Store is OPEN</div>
            <button onclick="toggleShopStatus()" class="btn">Toggle Open / Closed</button>
        </section>

        <!-- 2. Upload New Item from Device Gallery -->
        <section class="admin-section">
            <h2>Upload New Item from Device</h2>
            <form id="itemForm">
                <label for="itemName">Item Name:</label>
                <input type="text" id="itemName" placeholder="e.g., Gold Necklace" required>

                <label for="itemPrice">Price (₹):</label>
                <input type="number" id="itemPrice" placeholder="e.g., 45000" required>

                <label for="itemImage">Choose Image from Device:</label>
                <input type="file" id="itemImage" accept="image/*" required>

                <label for="itemTag">Tag (Optional):</label>
                <select id="itemTag">
                    <option value="">None</option>
                    <option value="New Arrival">New Arrival</option>
                    <option value="Best Seller">Best Seller</option>
                </select>

                <button type="submit" class="btn">Add to Gallery</button>
            </form>
        </section>

        <!-- 3. Manage / Delete / Edit Inventory -->
        <section class="admin-section">
            <h2>Manage Current Inventory</h2>
            <div id="adminGallery" class="product-grid"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
